<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RA Practice Scenarios</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>RA Practice Scenarios</h1>
      <p class="tagline">Practice mediating a roommate conflict</p>
    </header>

    <!-- SETUP: Topic and difficulty -->
    <section id="setup">
      <h2>Start a Practice Session</h2>
      <div class="form-row">
        <label for="topic-input">Topic:</label>
        <input type="text" id="topic-input" value="noise" placeholder="e.g. noise, cleaning, guests..." />
      </div>
      <div class="form-row">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
          <option value="easy" selected>Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <button id="start-btn" class="btn btn-primary">Start Session</button>
    </section>

    <!-- CHAT: Mediation in progress -->
    <section id="chat-section" class="hidden">
      <div class="chat-header">
        <h2>Roommate Mediation</h2>
        <div class="meta">
          Topic: <span id="topic-display">noise</span> ·
          Difficulty: <span id="difficulty-display">easy</span>
        </div>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input-row">
        <input type="text" id="ra-input" placeholder="Type your response as the RA..." autocomplete="off" />
        <button id="send-btn" class="btn btn-primary">Send</button>
      </div>
      <div class="chat-actions">
        <button id="end-btn" class="btn btn-secondary">End Session & Debrief</button>
      </div>
    </section>

    <!-- DEBRIEF: Session summary -->
    <section id="debrief-section" class="hidden">
      <h2>Debrief</h2>
      <div id="debrief-content" class="debrief-content"></div>
      <button id="restart-btn" class="btn btn-primary">Start New Session</button>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
