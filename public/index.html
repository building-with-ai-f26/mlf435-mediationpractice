<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resident Assistant Practice Scenarios</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Resident Assistant Practice Scenarios</h1>
      <p class="tagline">Practice Various Commonplace RA Situations</p>
    </header>

    <!-- SETUP -->
    <section id="setup">
      <h2>Start a Practice Session</h2>
      <div class="form-row">
        <label for="ra-name">Your Name:</label>
        <input type="text" id="ra-name" placeholder="Enter your name" />
      </div>
      <div class="form-row">
        <label for="topic-select">Situation:</label>
        <select id="topic-select">
          <option value="noise">Noise</option>
          <option value="cleaning">Cleaning</option>
          <option value="guest policy">Guest Policy</option>
          <option value="hygiene">Hygiene</option>
          <option value="shared items">Shared Items</option>
        </select>
      </div>
      <div class="form-row">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
          <option value="easy" selected>Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <button id="start-btn" class="btn btn-primary">Start Session</button>
    </section>

    <!-- CHAT -->
    <section id="chat-section" class="hidden">
      <div class="chat-header">
        <h2>Roommate Mediation</h2>
        <div class="meta">
          RA: <span id="ra-name-display">You</span> ·
          Situation: <span id="topic-display">noise</span> ·
          Difficulty: <span id="difficulty-display">easy</span>
        </div>
      </div>

      <!-- CONTEXT CARDS -->
      <div id="context-cards" class="context-cards"></div>

      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input-row">
        <input type="text" id="ra-input" placeholder="Type your response as the RA..." autocomplete="off" />
        <button id="send-btn" class="btn btn-primary">Send</button>
      </div>
      <div class="chat-actions">
        <button id="end-btn" class="btn btn-secondary">End Session & Debrief</button>
      </div>
    </section>

    <!-- DEBRIEF -->
    <section id="debrief-section" class="hidden">
      <h2>Debrief</h2>

      <div class="debrief-meta">
        <p>RA: <span id="debrief-ra-name"></span> · Situation: <span id="debrief-topic"></span> · Difficulty: <span id="debrief-difficulty"></span></p>
      </div>

      <div id="individual-graders" class="graders-section"></div>

      <div class="consolidated-section">
        <h3>Consolidated Feedback</h3>
        <div id="consolidated-debrief" class="debrief-content"></div>
      </div>

      <button id="restart-btn" class="btn btn-primary">Start New Session</button>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
