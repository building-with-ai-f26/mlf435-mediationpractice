name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server.mjs
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Secret scan
        run: |
          PATTERN='sk-or-v1-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{10,}|sb_secret_[A-Za-z0-9_-]{10,}|phx_[A-Za-z0-9]{20,}|service_role.*eyJ'
          # -I skips binary files, -n adds line numbers, -o is not used; cut keeps file:line only.
          HITS=$(git grep -InE "$PATTERN" -- . ':(exclude)tests' ':(exclude).github' | cut -d: -f1,2 || true)
          if [ -n "$HITS" ]; then
            echo "Possible secret found at (file:line):"
            echo "$HITS"
            exit 1
          fi
          echo "No secrets found."
